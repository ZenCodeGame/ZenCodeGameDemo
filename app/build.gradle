plugins {
    alias(libs.plugins.android.application)
}

android {
    namespace 'com.android.zencodegame.demo'
    compileSdk 36

    defaultConfig {
        applicationId "com.zencodegame.android.demo"
        minSdk 24
        targetSdk 36
        versionCode 171
        versionName "1.0.1"
        manifestPlaceholders["app_key"] = ""
        manifestPlaceholders["APP_ID"] = "10035"
        manifestPlaceholders["APP_SECRET"] = ""
        manifestPlaceholders["Google_Client_Id"] = "536019673773-en4onusp7tohrq4blmnmqd4atd714jnm.apps.googleusercontent.com"
        manifestPlaceholders["VKIDClientID"] = ""
        manifestPlaceholders["VKIDClientSecret"] = ""
        manifestPlaceholders["VKIDRedirectHost"] = ""
        manifestPlaceholders["VKIDRedirectScheme"] = ""
    }

    signingConfigs {
        create("release") {
            storeFile = file("/Users/astroboy/workspace/mcgame/zkgame-keystore.jks")
            storePassword = "zkgame2025"
            keyAlias = "zkgame"
            keyPassword = "zkgame2025"
            enableV2Signing=true
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }

        debug {
            minifyEnabled false
            signingConfig signingConfigs.release
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    // 添加厂商维度
    flavorDimensions += "vendor"
    // 定义不同厂商的构建变体
    productFlavors {
        create("huawei") {
            dimension = "vendor"
            apply plugin: "com.huawei.agconnect"
            // HUAWEI特定的配置
            applicationId = "com.sqrush.merge.huawei"
            versionCode=100
            versionName="1.0.0"
            manifestPlaceholders["app_key"] = ""
            manifestPlaceholders["APP_ID"] = "10031"
            manifestPlaceholders["APP_SECRET"] = "115239063"
            manifestPlaceholders["VKIDClientID"] = "54112794"
            manifestPlaceholders["VKIDClientSecret"] = "SSK3q7ZdKI5WPn7zP2f8"
            manifestPlaceholders["VKIDRedirectHost"] = "vk.ru"
            manifestPlaceholders["VKIDRedirectScheme"] = "vk54112794"
        }
        create("xiaomi") {
            dimension = "vendor"
            // 小米特定的配置
            applicationId = "com.zencodegame.android.demo"
            versionCode=100
            versionName="1.0.0_mitest"
            manifestPlaceholders["app_key"] = ""
            manifestPlaceholders["APP_ID"] = "10035"
            manifestPlaceholders["APP_SECRET"] = ""
            manifestPlaceholders["Google_Client_Id"] = "536019673773-en4onusp7tohrq4blmnmqd4atd714jnm.apps.googleusercontent.com"
            manifestPlaceholders["VKIDClientID"] = "54112794"
            manifestPlaceholders["VKIDClientSecret"] = "SSK3q7ZdKI5WPn7zP2f8"
